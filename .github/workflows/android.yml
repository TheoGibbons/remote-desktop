name: Check the Android app

# Builds, lints and tests the Android app the way a release does, with a
# throwaway signing key, whenever the Android code on main changes.
#
# It is also what spares a release from downloading its libraries. A release is
# built from a tag, and a run on a tag can read only the caches that runs on
# main have written. GitHub drops a cache that nothing has read for seven days,
# hence the schedule.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/scripts/**'
      - '.github/workflows/android.yml'
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint and test
    # The same system as the release: a cache is only read on the system that
    # wrote it.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # When the job ends on main, this saves what Gradle downloaded.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads the Android versions its tests run on by itself,
      # outside Gradle. release.yml reads this cache under the same key. It is
      # saved when the whole job has passed.
      - name: Keep Robolectric's Android jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Build, lint and test as a release does
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: throwaway
          ANDROID_KEY_ALIAS: check
          ANDROID_KEY_PASSWORD: throwaway
          DEFAULT_RELAY_SERVER_URL: wss://relay.remote-desktop.co/ws
          RELEASE_VERSION_CODE: '9'
        run: |
          # A signing key made for this run and gone with it. The release key
          # is only given to a release.
          $env:ANDROID_KEYSTORE_FILE = Join-Path $env:RUNNER_TEMP 'throwaway.jks'
          keytool -genkeypair -keystore $env:ANDROID_KEYSTORE_FILE -storepass throwaway -keypass throwaway `
            -alias check -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Throwaway key of the Android check'
          if ($LASTEXITCODE -ne 0) { throw 'keytool made no signing key.' }
          # A release names its version, and a named version turns the app's
          # update checks on.
          $env:RELEASE_VERSION_NAME = (Get-Content -Raw server/package.json | ConvertFrom-Json).version
          ./.github/scripts/build-android.ps1

      - name: Name what failed
        if: failure()
        shell: pwsh
        run: ./.github/scripts/name-android-failures.ps1
